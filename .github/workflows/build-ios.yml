name: Build iOS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - 'cpp/**'
      - 'ios/**'
      - '*.podspec'
      - 'package.json'
      - 'yarn.lock'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'example/Gemfile*'
      - 'example/ios/**'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'cpp/**'
      - 'ios/**'
      - '*.podspec'
      - 'package.json'
      - 'yarn.lock'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'example/Gemfile*'
      - 'example/ios/**'

jobs:
  build:
    name: Build iOS Example App
    # The ARM64 pool behind macos-latest failed runner acquisition before any steps ran.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Yarn
        run: npm install --global yarn@1.22.19
      - name: Install package dependencies
        run: yarn install --frozen-lockfile
      - name: Install example dependencies
        run: yarn install --frozen-lockfile --cwd example

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example
      - name: Install Pods
        working-directory: example
        run: bundle exec pod install --project-directory=ios
      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace TfliteExample.xcworkspace \
            -scheme TfliteExample \
            -derivedDataPath build \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Show raw failure diagnostics
        if: failure()
        working-directory: example/ios
        run: |
          if [ -f xcodebuild.log ]; then
            grep -n -A 35 -B 5 -E 'Undefined symbols|error:|ld:' xcodebuild.log || true
            tail -n 30 xcodebuild.log
          fi
      - name: Upload native build evidence
        if: always()
        # Artifact-service outages must not replace the actual compiler result.
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            example/ios/xcodebuild.log
            example/ios/Podfile.lock
          if-no-files-found: ignore
