name: Validate JS

on:
  push:
    branches:
      - main
      - codex/native-model-loader
    paths:
      - '.github/workflows/validate-js.yml'
      - 'src/**'
      - '*.json'
      - '*.js'
      - '*.lock'
      - 'example/src/**'
      - 'example/*.json'
      - 'example/*.js'
      - 'example/*.lock'
  pull_request:
    paths:
      - '.github/workflows/validate-js.yml'
      - 'src/**'
      - '*.json'
      - '*.js'
      - '*.lock'
      - 'example/src/**'
      - 'example/*.json'
      - 'example/*.js'
      - 'example/*.lock'

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test and lint package and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock
      - name: Install Yarn
        run: npm install --global yarn@1.22.19
      - name: Install package and example dependencies
        run: |
          yarn install --frozen-lockfile
          yarn install --frozen-lockfile --cwd example
      - name: Typecheck package and example
        run: |
          yarn typescript
          yarn --cwd example typescript
      - name: Run package tests
        run: yarn test --runInBand
      - name: Lint package and example
        run: |
          yarn lint
          yarn --cwd example lint
          git diff --exit-code
