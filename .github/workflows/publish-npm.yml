name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate tag matches package version
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publishing requires a version tag."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag version (v$TAG) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify publish registry
        run: |
          npm config get registry
          npm config get @kyselicaa:registry

      - name: Publish package
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist-tag }}"
